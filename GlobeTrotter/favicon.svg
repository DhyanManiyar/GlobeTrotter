<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="gtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#09090B" />
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Outer Orbit Ring -->
  <ellipse cx="32" cy="32" rx="22" ry="10" transform="rotate(-30 32 32)" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="3 2" />

  <!-- Glowing Core Globe Sphere -->
  <circle cx="32" cy="32" r="14" fill="url(#gtGrad)" filter="url(#glow)" />
  
  <!-- Globe Meridians & Latitude lines -->
  <ellipse cx="32" cy="32" rx="7" ry="14" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
  <line x1="18" y1="32" x2="46" y2="32" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />

  <!-- Supersonic Flight Orbit Marker / Jet icon -->
  <circle cx="48" cy="22" r="3.5" fill="#38BDF8" />
  <circle cx="48" cy="22" r="5.5" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
</svg>
